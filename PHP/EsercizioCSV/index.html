<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leggi CSV indirizzi</title>
</head>
<body>
    <form action="articoli.php" method="POST">
        <label for="Cod_Articolo">Codice Articolo</label><br>
        <input type="text" name="Cod_Articolo" ><br>
        
        <label for="Descrizione">Descrizione</label><br>
        <input type="text" name="Descrizione" ><br>
        
        <label for="Quantita">Quantita</label><br>
        <input type="number" name="Quantita" value="1"><br>
        
        <label for="Prezzo">Prezzo</label><br>
        <span>€</span>
        <input type="number" name="Prezzo" min="0" step="0.01" placeholder="0.00" ><br>

        <label for="Cod_Fornitore">codice fornitore</label><br>
        <input type="text" name="Cod_Fornitore" ><br>

        <input type="submit" name="azione" value="crea"> <!-- crea file di testo eliminando il vecchio; puo essere vuoto o con una riga in base allo stato degli input sopra -->
        <input type="submit" name="azione" value="aggiungi"> <!-- aggiunge una riga al file CSV -->
        <input type="submit" name="azione" value="carica DB"> <!-- aggiunge le nuove righe del csv al DB -->

    </form>
</body>
</html>
