        function posiziona(){

                console.log(albero.src);
                console.log(nomeAlbero.z);
                if("erbaBassa.png"===nomeAlbero){
                    albero.style.zIndex=1;
                }
                document.querySelector("body").appendChild(albero);
            }
        }
    </script>
    <style>
        img{
            display: inline;

            bottom: 0;
        }
