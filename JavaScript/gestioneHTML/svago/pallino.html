<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        "use strict"
        let nPallini=6;
        let gradi=360/nPallini;
        function reposition(){
            generaPallini(nPallini);
            let centro=document.getElementById("centro");
            let pallini=document.getElementsByClassName("intorno");
            //coordinate polari
            pallini.forEach(element => {
                element.left=centro.left+100*Math.cos(0);
            });
        }
        function generaPallini(nPallini){
            let corpo=document.querySelector("body");
            for(let i=0; i<nPallini; i++){
                let div=document.createElement("div");
                div.setAttribute("class","intorno")
                corpo.appendChild(div);
            }
        }
    </script>
    <style>
        div{
            position: fixed;
            width: 50px;
            height: 50px;
            border-radius:50%;
        }
        #centro{
            background-color: red;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
        }
        .intorno{
            background-color: blue;
            position: absolute;

        }
    </style>
</head>
<body onload="reposition()">
    <div id="centro"></div>
</body>
</html>
